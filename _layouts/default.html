<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LegalService",
    "name": "{{ site.company.name }}",
    "founder": "{{ site.company.ceo }}",
    "image": "{{ '/assets/images/og-image.png' | absolute_url }}",
    "telephone": "{{ site.company.phone }}",
    "email": "{{ site.company.email }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site.company.address }}",
      "addressCountry": "KR"
    },
    "url": "{{ site.url }}",
    "areaServed": "KR",
    "priceRange": "상담 후 안내"
  }
  </script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
