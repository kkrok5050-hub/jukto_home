# GitHub Pages가 기본 지원하는 플러그인만 사용 (별도 빌드 서버 불필요)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

collections:
  services:
    output: true
    permalink: /services/:path/
  cases:
    output: true
    permalink: /cases/:path/

defaults:
  - scope:
      path: ""
      type: services
    values:
      layout: service

  - scope:
      path: ""
      type: cases
    values:
      layout: case

  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
